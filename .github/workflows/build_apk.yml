name: Build Android APK Standard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python Environment (Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Flutter SDK (Pinned 3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Build Android APK with Flet
        run: |
          flet build apk --build-version 2

      - name: Upload Artifact APK Package
        uses: actions/upload-artifact@v4
        with:
          name: MasteringAudio-APK-Release
          path: build/apk/**/*.apk
          retention-days: 7
